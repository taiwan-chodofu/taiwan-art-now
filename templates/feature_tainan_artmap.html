const KEYWORDS = ['迴圈','標本','保存','記憶','政治暴力','原住民族','外部の視線','土地','離別'];

/* ============================================================
   GRAPH ASSEMBLY
   ============================================================ */
const nodes = [];
const links = [];
const nodeById = {};
function addNode(n) { nodeById[n.id] = n; nodes.push(n); }

addNode({id:'root:biennale', label:'迴圈．超展開\n臺南藝術雙年展', type:'root', group:'biennale', r:34});
addNode({id:'root:festival', label:'第23屆\n南方影展', type:'root', group:'festival', r:34});

BIENNALE_SUBTHEMES.forEach(s => {
  addNode({id:s.id, label:s.label, type:'subtheme', group:'biennale', r:16, curator:s.curator});
  links.push({source:'root:biennale', target:s.id, kind:'official'});
});
BIENNALE_ARTISTS.forEach(a => {
  const id = 'artist:'+a.name;
  addNode({id, label:a.name, type:'artist', group:'biennale', r:9, nat:a.nat, bio:a.bio});
  links.push({source:a.sub, target:id, kind:'official'});
});

FESTIVAL_CATEGORIES.forEach(c => {
  addNode({id:c.id, label:c.label, type:'category', group:'festival', r:15});
  links.push({source:'root:festival', target:c.id, kind:'official'});
});
FESTIVAL_WORKS.forEach(w => {
  const wid = 'work:'+w.title;
  addNode({id:wid, label:w.title, type:'work', group:'festival', r:8, director:w.director, country:w.country, syn:w.syn, url:w.url});
  w.cats.forEach(c => links.push({source:'cat:'+c, target:wid, kind:'official'}));
  const did = 'person:'+w.director;
  if (!nodeById[did]) addNode({id:did, label:w.director, type:'director', group:'festival', r:6});
  links.push({source:wid, target:did, kind:'official'});
  (w.kw||[]).forEach(k => {
    const kid = 'kw:'+k;
    links.push({source:kid, target:wid, kind:'thematic'});
  });
});
/* biennale side keyword hooks, hand-picked from already-established essay content */
links.push({source:'kw:迴圈', target:'artist:Wanapati Yunupiŋu', kind:'thematic'});
links.push({source:'kw:標本', target:'artist:郭俞平', kind:'thematic'});
links.push({source:'kw:政治暴力', target:'sub:歷史迴圈', kind:'thematic'});
links.push({source:'kw:原住民族', target:'artist:拉黑子．達立夫', kind:'thematic'});
links.push({source:'kw:原住民族', target:'artist:武玉玲', kind:'thematic'});
links.push({source:'kw:土地', target:'sub:風景迴圈', kind:'thematic'});

KEYWORDS.forEach(k => {
  const kid = 'kw:'+k;
  if (!nodeById[kid]) addNode({id:kid, label:k, type:'keyword', group:'keyword', r:13});
});

/* resolve link endpoints to node refs */
links.forEach(l => { l.s = nodeById[l.source]; l.t = nodeById[l.target]; });
const validLinks = links.filter(l => l.s && l.t);

/* ============================================================
   FORCE SIMULATION (hand-rolled, no deps)
   ============================================================ */
const svg = document.getElementById('graph');
const NS = 'http://www.w3.org/2000/svg';
let W = window.innerWidth, H = window.innerHeight;

nodes.forEach(n => {
  let cx = W/2, cy = H/2, spread = 180;
  if (n.type === 'root') spread = 0;
  else if (n.group === 'biennale') { cx = W*0.3; }
  else if (n.group === 'festival') { cx = W*0.7; }
  else if (n.group === 'keyword') { cx = W*0.5; cy = H*0.15; }
  n.x = cx + (Math.random()-0.5)*spread*2;
  n.y = cy + (Math.random()-0.5)*spread*2;
  n.vx = 0; n.vy = 0;
});
nodeById['root:biennale'].x = W*0.28; nodeById['root:biennale'].y = H*0.5;
nodeById['root:festival'].x = W*0.72; nodeById['root:festival'].y = H*0.5;

const linkedSet = {};
validLinks.forEach(l => {
  (linkedSet[l.s.id] = linkedSet[l.s.id]||[]).push(l.t.id);
  (linkedSet[l.t.id] = linkedSet[l.t.id]||[]).push(l.s.id);
});

let camX=0, camY=0, camScale=1;
const gLinks = document.createElementNS(NS,'g');
const gNodes = document.createElementNS(NS,'g');
svg.appendChild(gLinks); svg.appendChild(gNodes);

const COLORS = { biennale: 'var(--jade)', festival: 'var(--accent)', keyword: 'var(--amber)' };
function colorFor(n) {
  if (n.type === 'root') return n.group === 'biennale' ? '#2f6b52' : '#c23b1f';
  if (n.group === 'biennale') return '#2f6b52';
  if (n.group === 'festival') return '#c23b1f';
  return '#a8792a';
}

const linkEls = validLinks.map(l => {
  const el = document.createElementNS(NS,'line');
  el.setAttribute('stroke', l.kind==='thematic' ? '#a8792a' : 'rgba(23,19,15,0.28)');
  el.setAttribute('stroke-width', l.kind==='thematic' ? '1' : '1.1');
  if (l.kind==='thematic') el.setAttribute('stroke-dasharray','3,3');
  el.dataset.kind = l.kind;
  el.dataset.a = l.s.id; el.dataset.b = l.t.id;
  gLinks.appendChild(el);
  return el;
});

const nodeEls = nodes.map(n => {
  const g = document.createElementNS(NS,'g');
  g.setAttribute('class','node');
  g.dataset.id = n.id; g.dataset.group = n.group; g.dataset.type = n.type;
  const c = document.createElementNS(NS,'circle');
  c.setAttribute('r', n.r);
  c.setAttribute('fill', n.type==='root' ? colorFor(n) : (n.group==='keyword' ? 'none' : '#f3efe3'));
  c.setAttribute('stroke', colorFor(n));
  c.setAttribute('stroke-width', n.type==='root' ? 0 : 1.6);
  g.appendChild(c);
  const t = document.createElementNS(NS,'text');
  t.setAttribute('text-anchor','middle');
  t.setAttribute('font-family', n.type==='root' ? "'Zen Old Mincho',serif" : "'Noto Sans JP',sans-serif");
  t.setAttribute('font-size', n.type==='root' ? 12 : (n.type==='subtheme'||n.type==='category' ? 9.5 : 8.2));
  t.setAttribute('fill', n.type==='root' ? '#f3efe3' : '#17130f');
  t.setAttribute('pointer-events','none');
  if (n.type==='root') {
    n.label.split('\n').forEach((line,i) => {
      const ts = document.createElementNS(NS,'tspan');
      ts.setAttribute('x',0); ts.setAttribute('dy', i===0?0:12);
      ts.textContent = line;
      t.appendChild(ts);
    });
    t.setAttribute('y', -2);
  } else {
    t.setAttribute('y', n.r + 11);
    t.textContent = n.label.length > 11 ? n.label.slice(0,10)+'…' : n.label;
  }
  g.appendChild(t);
  g.style.cursor = 'pointer';
  gNodes.appendChild(g);
  return g;
});

function tick() {
  const alpha = 0.08;
  for (let i=0;i<nodes.length;i++) {
    const a = nodes[i];
    let fx=0, fy=0;
    for (let j=0;j<nodes.length;j++) {
      if (i===j) continue;
      const b = nodes[j];
      let dx = a.x-b.x, dy = a.y-b.y;
      let d2 = dx*dx+dy*dy; if (d2<100) d2=100;
      const rep = Math.min(140 / d2, 0.6);
      fx += dx*rep; fy += dy*rep;
    }
    const cx = a.group==='biennale'? W*0.3 : a.group==='festival'? W*0.7 : W*0.5;
    const cy = a.group==='keyword'? H*0.15 : H*0.5;
    fx += (cx-a.x)*0.01; fy += (cy-a.y)*0.01;
    a.fx = fx; a.fy = fy;
  }
  validLinks.forEach(l => {
    const dx=l.t.x-l.s.x, dy=l.t.y-l.s.y;
    const dist = Math.sqrt(dx*dx+dy*dy)||1;
    const target = l.kind==='thematic' ? 150 : 65;
    const k = l.kind==='thematic' ? 0.02 : 0.06;
    const f = (dist-target)*k;
    const fx = dx/dist*f, fy = dy/dist*f;
    l.s.fx += fx; l.s.fy += fy;
    l.t.fx -= fx; l.t.fy -= fy;
  });
  nodes.forEach(n => {
    if (n.dragging) return;
    n.vx = (n.vx + n.fx*alpha) * 0.78;
    n.vy = (n.vy + n.fy*alpha) * 0.78;
    const sp = Math.sqrt(n.vx*n.vx+n.vy*n.vy);
    const maxSp = 14;
    if (sp > maxSp) { n.vx = n.vx/sp*maxSp; n.vy = n.vy/sp*maxSp; }
    n.x += n.vx; n.y += n.vy;
  });

  linkEls.forEach(el => {
    const a = nodeById[el.dataset.a], b = nodeById[el.dataset.b];
    el.setAttribute('x1',a.x); el.setAttribute('y1',a.y);
    el.setAttribute('x2',b.x); el.setAttribute('y2',b.y);
  });
  nodeEls.forEach(g => {
    const n = nodeById[g.dataset.id];
    g.setAttribute('transform', `translate(${n.x},${n.y})`);
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function fitToView() {
  const xs = nodes.map(n=>n.x), ys = nodes.map(n=>n.y);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const pad = 80;
  const scaleX = W / (maxx-minx+pad*2), scaleY = H / (maxy-miny+pad*2);
  camScale = Math.max(0.25, Math.min(1, Math.min(scaleX, scaleY)));
  camX = W/2 - (minx+maxx)/2*camScale;
  camY = H/2 - (miny+maxy)/2*camScale;
  applyCamera();
}
setTimeout(fitToView, 2600);

function applyCamera() {
  gLinks.setAttribute('transform', `translate(${camX},${camY}) scale(${camScale})`);
  gNodes.setAttribute('transform', `translate(${camX},${camY}) scale(${camScale})`);
}
applyCamera();

/* pan + zoom */
let panning=false, panStart={x:0,y:0}, camStart={x:0,y:0};
svg.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  panning=true; svg.classList.add('panning');
  panStart={x:e.clientX,y:e.clientY}; camStart={x:camX,y:camY};
});
window.addEventListener('mousemove', e => {
  if (!panning) return;
  camX = camStart.x + (e.clientX-panStart.x);
  camY = camStart.y + (e.clientY-panStart.y);
  applyCamera();
});
window.addEventListener('mouseup', () => { panning=false; svg.classList.remove('panning'); });
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const prev = camScale;
  camScale = Math.max(0.3, Math.min(2.5, camScale * (e.deltaY<0?1.08:0.92)));
  const r = prev ? camScale/prev : 1;
  camX = e.clientX - (e.clientX-camX)*r;
  camY = e.clientY - (e.clientY-camY)*r;
  applyCamera();
}, {passive:false});

/* node drag */
nodeEls.forEach(g => {
  g.addEventListener('mousedown', e => {
    e.stopPropagation();
    const n = nodeById[g.dataset.id];
    n.dragging = true;
    const move = ev => {
      n.x = (ev.clientX - camX)/camScale;
      n.y = (ev.clientY - camY)/camScale;
    };
    const up = () => { n.dragging=false; window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove',move);
    window.addEventListener('mouseup',up);
  });
  g.addEventListener('click', e => {
    e.stopPropagation();
    showPanel(nodeById[g.dataset.id]);
    highlight(g.dataset.id);
  });
});

function highlight(id) {
  nodeEls.forEach(g => g.style.opacity = (g.dataset.id===id || (linkedSet[id]||[]).includes(g.dataset.id)) ? 1 : 0.22);
  linkEls.forEach(el => el.style.opacity = (el.dataset.a===id || el.dataset.b===id) ? 1 : 0.08);
}
svg.addEventListener('dblclick', () => {
  nodeEls.forEach(g => g.style.opacity = 1);
  linkEls.forEach(el => el.style.opacity = 1);
  panel.classList.remove('show');
});

/* side panel */
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
document.getElementById('panelClose').addEventListener('click', () => panel.classList.remove('show'));

function showPanel(n) {
  const typeLabel = {root:'特集ページ', subtheme:'雙年展・子題', artist:'雙年展・アーティスト', category:'南方影展・カテゴリ', work:'南方影展・作品', director:'南方影展・監督', keyword:'テーマ接続（編集的分類）'}[n.type] || n.type;
  let html = `<p class="ptype mono">${typeLabel}</p><h2 class="heading">${n.label.replace(/\n/g,' ')}</h2>`;
  if (n.curator) html += `<p class="meta-line">キュレーター：${n.curator}</p>`;
  if (n.nat) html += `<p class="meta-line">${n.nat}</p>`;
  if (n.director) html += `<p class="meta-line">監督：${n.director}${n.country?' ／ '+n.country:''}</p>`;
  if (n.bio) html += `<p class="body">${n.bio}</p>`;
  if (n.syn) html += `<p class="body">${n.syn}</p>`;
  const conns = (linkedSet[n.id]||[]).map(id => nodeById[id]).filter(Boolean);
  if (conns.length) {
    html += `<p class="meta-line" style="margin-top:1rem;">つながり（${conns.length}）</p><ul class="conn-list">`;
    conns.slice(0,24).forEach(c => { html += `<li data-go="${c.id}">${c.label.replace(/\n/g,' ')}</li>`; });
    html += `</ul>`;
  }
  if (n.url) html += `<a class="ext" href="${n.url}" target="_blank" rel="noopener">公式サイトで見る →</a>`;
  panelBody.innerHTML = html;
  panel.classList.add('show');
  panelBody.querySelectorAll('[data-go]').forEach(li => {
    li.addEventListener('click', () => { showPanel(nodeById[li.dataset.go]); highlight(li.dataset.go); });
  });
}

/* filters */
const filterState = { biennale:true, festival:true, keyword:true };
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  const f = btn.dataset.f;
  filterState[f] = !filterState[f];
  btn.classList.toggle('off', !filterState[f]);
  nodeEls.forEach(g => {
    const grp = g.dataset.group;
    g.style.display = filterState[grp] !== false ? '' : 'none';
  });
  linkEls.forEach(el => {
    const a = nodeById[el.dataset.a], b = nodeById[el.dataset.b];
    const vis = filterState[a.group]!==false && filterState[b.group]!==false;
    el.style.display = vis ? '' : 'none';
  });
});

window.addEventListener('resize', () => { W=window.innerWidth; H=window.innerHeight; });
</script>
</body>
</html>
