name: Keep Render instance awake

on:
  schedule:
    # 10分おきに実行（Render無料枠は15分アイドルでスリープするため）
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: curl -sS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" https://taiwan-art-now.onrender.com/
