  push:
    branches:
      - 'feat/private-subscriber-storage-adapter-83'

permissions:
  contents: read

jobs:
  synthetic-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Flask and psycopg for isolated tests
        run: python -m pip install flask==3.1.0 'psycopg[binary]==3.2.6'
      - name: Audit all four legacy exhibition writer surfaces
        run: python scripts/audit_legacy_exhibition_writers.py
      - name: Compile security modules
        run: python -m py_compile private_subscriber_store.py private_inbox.py private_inbox_admin.py subscriber_mutations.py webhook_security.py scripts/import_private_subscribers.py
      - name: Run synthetic-only unit tests
        run: python -m unittest discover -s tests -p 'test_private_*.py' -v && python -m unittest discover -s tests -p 'test_subscriber_mutations.py' -v && python -m unittest discover -s tests -p 'test_webhook_security.py' -v && python -m unittest discover -s tests -p 'test_webhook_wiring.py' -v && python -m unittest discover -s tests -p 'test_flask_webhook_http.py' -v && python -m unittest discover -s tests -p 'test_private_destination_preflight.py' -v && python -m unittest discover -s tests -p 'test_private_backup_verification.py' -v && python -m unittest discover -s tests -p 'test_source_freeze.py' -v && python -m unittest discover -s tests -p 'test_subscriber_ownership_audit.py' -v && python -m unittest discover -s tests -p 'test_messenger_link_challenge.py' -v && python -m unittest discover -s tests -p 'test_messenger_link_store.py' -v && python -m unittest discover -s tests -p 'test_staging_drill_guard.py' -v && python -m unittest discover -s tests -p 'test_browser_session.py' -v && python -m unittest discover -s tests -p 'test_browser_session_store.py' -v && python -m unittest discover -s tests -p 'test_browser_cookie_security.py' -v && python -m unittest discover -s tests -p 'test_messenger_session_exchange.py' -v && python -m unittest discover -s tests -p 'test_messenger_browser_claim.py' -v && python -m unittest discover -s tests -p 'test_private_browser_claim_http.py' -v && python -m unittest discover -s tests -p 'test_subscriber_ownership.py' -v && python -m unittest discover -s tests -p 'test_private_claim_rate_limit.py' -v && python -m unittest discover -s tests -p 'test_private_claim_limiter_adapter.py' -v && python -m unittest discover -s tests -p 'test_claim_rate_limit_staging_guard.py' -v && python -m unittest discover -s tests -p 'test_private_subscriber_route_guard_http.py' -v && python -m unittest discover -s tests -p 'test_private_messenger_operations.py' -v && python -m unittest discover -s tests -p 'test_private_messenger_api_http.py' -v && python -m unittest discover -s tests -p 'test_frontend_subscriber_audit.py' -v && python -m unittest discover -s tests -p 'test_subscriber_reconciliation.py' -v && python -m unittest discover -s tests -p 'test_versioned_subscriber_sync.py' -v && python -m unittest discover -s tests -p 'test_versioned_subscriber_store.py' -v && python -m unittest discover -s tests -p 'test_versioned_subscriber_api_http.py' -v && python -m unittest discover -s tests -p 'test_reviewed_subscriber_intent.py' -v && python -m unittest discover -s tests -p 'test_subscriber_review_confirmation.py' -v && python -m unittest discover -s tests -p 'test_subscriber_review_api_http.py' -v && python scripts/audit_frontend_subscriber_calls.py --report-only && python scripts/audit_subscriber_ownership.py --report-only

  disposable-postgres-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tan_ci
          POSTGRES_PASSWORD: synthetic_only_ci
          POSTGRES_DB: tan_ci_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tan_ci -d tan_ci_disposable"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TAN_CI_DISPOSABLE_POSTGRES: '1'
      TAN_CI_DATABASE_URL: postgresql://tan_ci:synthetic_only_ci@127.0.0.1:5432/tan_ci_disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Flask and psycopg
        run: python -m pip install flask==3.1.0 'psycopg[binary]==3.2.6'
      - name: Run concurrent synthetic writes on disposable local PostgreSQL
        run: python -m unittest discover -s tests -p 'test_disposable_postgres_cas.py' -v

  browser-sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic browser sync tests (Node built-in runner)
        run: node --test tests/test_draft_legacy_candidate_policy.cjs tests/test_draft_versioned_sync.cjs tests/test_draft_legacy_snapshot.cjs tests/test_draft_migration_review.cjs tests/test_draft_conflict_review_ui.cjs tests/test_draft_decision_verifier.cjs tests/test_draft_additive_merge.cjs tests/test_draft_explicit_keep.cjs tests/test_draft_review_click_bridge.cjs tests/test_draft_guarded_local_removal.cjs tests/test_draft_coordinated_local_removal.cjs tests/test_draft_legacy_real_shapes.cjs tests/test_draft_legacy_writer.cjs tests/test_draft_action_commit.cjs tests/test_draft_page_flow.cjs tests/test_draft_loss_detector.cjs tests/test_draft_checkpoint.cjs tests/test_draft_server_recovery.cjs tests/test_draft_recovery_verifier.cjs tests/test_draft_guarded_recovery.cjs tests/test_draft_authenticated_state.cjs tests/test_draft_additive_retry.cjs tests/test_draft_save_outcome_copy.cjs tests/test_draft_cutover_preflight.cjs tests/test_draft_page_action.cjs tests/test_draft_page_controller.cjs tests/test_draft_discover_flow.cjs

  draft-real-browser-e2e:
    # Playwright 1.58 Chromium does not support the ubuntu26.04 image used by ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Playwright runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Run real Chromium tests against local synthetic origin
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/tan-draft-http.log 2>&1 &
          npx playwright test tests/draft_browser_e2e.spec.cjs tests/draft_discover_additional_browser.spec.cjs tests/draft_discover_actual_template.spec.cjs --browser chromium --workers 1 --reporter=line
