name: Private subscriber safety tests

on:
  pull_request:
    paths:
      - 'private_subscriber_store.py'
      - 'private_inbox.py'
      - 'private_inbox_admin.py'
      - 'subscriber_mutations.py'
      - 'webhook_security.py'
      - 'app.py'
      - 'scripts/import_private_subscribers.py'
      - 'tests/test_private_*.py'
      - 'tests/test_subscriber_mutations.py'
      - 'tests/test_webhook_security.py'
      - 'tests/test_webhook_wiring.py'
      - 'tests/test_flask_webhook_http.py'
      - 'scripts/check_private_destination.py'
      - 'tests/test_private_destination_preflight.py'
      - 'scripts/verify_private_backup.py'
      - 'tests/test_private_backup_verification.py'
      - 'scripts/check_source_freeze.py'
      - 'tests/test_source_freeze.py'
      - 'scripts/audit_subscriber_ownership.py'
      - 'tests/test_subscriber_ownership_audit.py'
      - 'messenger_link_challenge.py'
      - 'tests/test_messenger_link_challenge.py'
      - 'messenger_link_store.py'
      - 'tests/test_messenger_link_store.py'
      - 'scripts/drill_messenger_link_concurrency.py'
      - 'tests/test_staging_drill_guard.py'
      - 'browser_session.py'
      - 'tests/test_browser_session.py'
      - 'browser_session_store.py'
      - 'tests/test_browser_session_store.py'
      - 'browser_cookie_security.py'
      - 'tests/test_browser_cookie_security.py'
      - 'messenger_session_exchange.py'
      - 'tests/test_messenger_session_exchange.py'
      - 'messenger_browser_claim.py'
      - 'tests/test_messenger_browser_claim.py'
      - 'private_browser_claim_routes.py'
      - 'tests/test_private_browser_claim_http.py'
      - 'subscriber_ownership.py'
      - 'tests/test_subscriber_ownership.py'
      - 'private_claim_rate_limit.py'
      - 'tests/test_private_claim_rate_limit.py'
      - 'private_claim_limiter_adapter.py'
      - 'tests/test_private_claim_limiter_adapter.py'
      - 'scripts/drill_claim_rate_limit_concurrency.py'
      - 'tests/test_claim_rate_limit_staging_guard.py'
      - 'private_subscriber_route_guard.py'
      - 'tests/test_private_subscriber_route_guard_http.py'
      - 'private_messenger_operations.py'
      - 'tests/test_private_messenger_operations.py'
      - 'private_messenger_api_routes.py'
      - 'tests/test_private_messenger_api_http.py'
      - 'scripts/audit_frontend_subscriber_calls.py'
      - 'tests/test_frontend_subscriber_audit.py'
      - 'subscriber_reconciliation.py'
      - 'tests/test_subscriber_reconciliation.py'
      - 'versioned_subscriber_sync.py'
      - 'tests/test_versioned_subscriber_sync.py'
      - 'docs/security/FRONTEND_SUBSCRIBER_CUTOVER.md'
      - 'docs/security/CLAIM_RATE_LIMIT_SCHEMA_DRAFT.sql'
      - 'docs/security/BROWSER_SESSION_SCHEMA_DRAFT.sql'
      - 'docs/security/STAGING_DRILL_GUARD_DRAFT.sql'
      - 'docs/security/MESSENGER_LINK_SCHEMA_DRAFT.sql'
      - '.github/workflows/private-subscriber-tests.yml'
  push:
    branches:
      - 'feat/private-subscriber-storage-adapter-83'

permissions:
  contents: read

jobs:
  synthetic-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flask for HTTP route tests
        run: python -m pip install flask==3.1.0
      - name: Compile security modules
        run: python -m py_compile private_subscriber_store.py private_inbox.py private_inbox_admin.py subscriber_mutations.py webhook_security.py scripts/import_private_subscribers.py
      - name: Run synthetic-only unit tests
        run: python -m unittest discover -s tests -p 'test_private_*.py' -v && python -m unittest discover -s tests -p 'test_subscriber_mutations.py' -v && python -m unittest discover -s tests -p 'test_webhook_security.py' -v && python -m unittest discover -s tests -p 'test_webhook_wiring.py' -v && python -m unittest discover -s tests -p 'test_flask_webhook_http.py' -v && python -m unittest discover -s tests -p 'test_private_destination_preflight.py' -v && python -m unittest discover -s tests -p 'test_private_backup_verification.py' -v && python -m unittest discover -s tests -p 'test_source_freeze.py' -v && python -m unittest discover -s tests -p 'test_subscriber_ownership_audit.py' -v && python -m unittest discover -s tests -p 'test_messenger_link_challenge.py' -v && python -m unittest discover -s tests -p 'test_messenger_link_store.py' -v && python -m unittest discover -s tests -p 'test_staging_drill_guard.py' -v && python -m unittest discover -s tests -p 'test_browser_session.py' -v && python -m unittest discover -s tests -p 'test_browser_session_store.py' -v && python -m unittest discover -s tests -p 'test_browser_cookie_security.py' -v && python -m unittest discover -s tests -p 'test_messenger_session_exchange.py' -v && python -m unittest discover -s tests -p 'test_messenger_browser_claim.py' -v && python -m unittest discover -s tests -p 'test_private_browser_claim_http.py' -v && python -m unittest discover -s tests -p 'test_subscriber_ownership.py' -v && python -m unittest discover -s tests -p 'test_private_claim_rate_limit.py' -v && python -m unittest discover -s tests -p 'test_private_claim_limiter_adapter.py' -v && python -m unittest discover -s tests -p 'test_claim_rate_limit_staging_guard.py' -v && python -m unittest discover -s tests -p 'test_private_subscriber_route_guard_http.py' -v && python -m unittest discover -s tests -p 'test_private_messenger_operations.py' -v && python -m unittest discover -s tests -p 'test_private_messenger_api_http.py' -v && python -m unittest discover -s tests -p 'test_frontend_subscriber_audit.py' -v && python -m unittest discover -s tests -p 'test_subscriber_reconciliation.py' -v && python -m unittest discover -s tests -p 'test_versioned_subscriber_sync.py' -v && python scripts/audit_frontend_subscriber_calls.py --report-only && python scripts/audit_subscriber_ownership.py --report-only
