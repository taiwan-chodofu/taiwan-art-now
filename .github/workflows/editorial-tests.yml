name: Editorial tests
on:
  pull_request:
    paths:
      - 'editorial/**'
      - 'templates/essay.html'
      - 'static/essay.*'
      - 'app.py'
      - 'tests/test_editorial.py'
      - '.github/workflows/editorial-tests.yml'
  push:
    branches: ['feat/editorial-essays-88']
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_editorial.py -v
      - run: node --check static/essay.js
