<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Isolated exhibition state staging</title></head>
<body>
<main>
 <h1>展示の保存操作（隔離テスト専用）</h1>
 <p>本番サイトではありません。認証済みの隔離サーバーに接続できない場合は操作できません。</p>
 <button type="button" id="favBtn" disabled aria-pressed="false">観たい</button>
 <button type="button" id="visitedBtn" disabled aria-pressed="false">観た</button>
 <div id="migrationReview" aria-live="polite"></div>
 <div id="restoreConfirm" hidden><p>この展示を「観たい」に戻しますか？</p><button type="button" id="restoreYes">戻す</button><button type="button" id="restoreNo">やめる</button></div>
 <p id="notice" role="status" aria-live="polite">保存状況を確認しています。</p>
 <button type="button" id="reloadState" hidden>最新の登録を表示する</button>
</main>
<script src="/static/js/draft_versioned_sync.js"></script>
<script src="/static/js/draft_authenticated_state.js"></script>
<script src="/static/js/draft_authenticated_writer.js"></script>
<script src="/static/js/draft_server_page_action.js"></script>
<script src="/static/js/draft_server_button_bridge.js"></script>
<script src="/static/js/draft_staging_page.js"></script>
<script src="/static/js/draft_legacy_snapshot.js"></script>
<script src="/static/js/draft_migration_review.js"></script>
<script src="/static/js/draft_simple_review_ui.js"></script>
<script src="/static/js/draft_explicit_server_restore.js"></script>
<script>
(function(){
 'use strict';
 const params=new URLSearchParams(location.search);
 const key=params.get('key');
 const notice=document.getElementById('notice');
 const reloadState=document.getElementById('reloadState');
 reloadState.addEventListener('click',()=>window.location.reload());
 if(!key||!/^[a-zA-Z0-9_-]{1,100}$/.test(key)){
  notice.textContent='展示IDを確認できません。正しいテスト用URLを開き直してください。';
  return;
 }
 try{
  const lifecycle=TanDraftStagingPage.create({
   win:window,fetchImpl:window.fetch.bind(window),notice,lang:'ja',
   items:[
    {element:document.getElementById('favBtn'),kind:'favs',key,value:true},
    {element:document.getElementById('visitedBtn'),kind:'visited',key,value:true}
   ]
  });
  lifecycle.start();
  // Optional read-only migration preview, isolated to explicit test mode.
  let reviewDisposed=false;
  let reviewMount=null;
  const confirmBox=document.getElementById("restoreConfirm");
  const yes=document.getElementById("restoreYes");
  const no=document.getElementById("restoreNo");
  let pending=null,reviewed=null,submitting=false;
  no.addEventListener("click",()=>{if(submitting)return;pending=null;confirmBox.hidden=true;notice.textContent="登録は変更していません。";});
  yes.addEventListener("click",async()=>{
   if(!pending||!reviewed||submitting||reviewDisposed)return;
   submitting=true;yes.disabled=true;no.disabled=true;
   const intent=pending;pending=null;
   const result=await TanDraftExplicitServerRestore.restore({
    fetchImpl:window.fetch.bind(window),kind:intent.kind,key:intent.key,
    value:reviewed.value,reviewedRevision:reviewed.revision,
    tombstoneRevision:reviewed.tombstoneRevision,confirmed:true
   });
   if(reviewDisposed)return;
   confirmBox.hidden=true;
   notice.textContent=result.status==="server_confirmed"
    ?(intent.kind==="visited"?"「観た」を保存しました。":"「観たい」を保存しました。")
    :result.status==="write_outcome_unknown"
     ?"保存できたか確認できません。「最新の登録を表示する」を押して確認してください。"
     :"登録状況が変わりました。「最新の登録を表示する」を押して確認してください。";
   // Confirmed writes can refresh in place using a fresh authenticated GET.
   // Unknown write outcomes must never be interpreted as confirmed or retried.
   document.getElementById("favBtn").disabled=true;
   document.getElementById("visitedBtn").disabled=true;
   if(result.status==="server_confirmed"){
    if(reviewMount)reviewMount.dispose();
    const updated=await lifecycle.refresh();
    if(reviewDisposed)return;
    if(updated){
     reloadState.hidden=true;
     notice.textContent=intent.kind==="visited"
      ?'「観た」を保存しました。最新の登録を表示しています。'
      :'「観たい」を保存しました。最新の登録を表示しています。';
    }else{
     reloadState.hidden=false;
     notice.textContent='保存しましたが、最新の表示を確認できません。「最新の登録を表示する」を押してください。';
    }
   }else{
    reloadState.hidden=false;
   }
   // Never re-enable stale buttons or repeat an uncertain POST.
  });
  if(params.get('review')==='1'){
   TanDraftAuthenticatedState.read({fetchImpl:window.fetch.bind(window)}).then(result=>{
    if(reviewDisposed||result.status!=='ready')return;
    const report=TanDraftMigrationReview.preview(window.localStorage,result.state);
    if(report.status!=='ready')return;
    const messages=TanDraftMigrationReview.explain(report,'ja');
    const legacy=TanDraftLegacySnapshot.read(window.localStorage);
    if(legacy.status!=='ready')return;
    if(reviewDisposed)return;
    reviewMount=TanDraftSimpleReviewUI.mount({container:document.getElementById('migrationReview'),
     doc:document,review:messages,onDecision:decision=>{
      const row=report.rows.find(r=>r.kind===decision.kind&&r.key===decision.key&&r.status==='deleted_remotely');
      const value=legacy.snapshot[decision.kind]?.[decision.key];
      if(!row||value===undefined||reviewDisposed)return;
      pending=decision;
      reviewed={revision:report.revision,tombstoneRevision:row.remoteRevision,value};
      confirmBox.querySelector('p').textContent=decision.kind==='favs'
       ?'この展示を「観たい」に戻しますか？':'この展示を「観た」に戻しますか？';
      confirmBox.hidden=false;
      notice.textContent='まだ登録は変更していません。';
      window.__draftReviewIntent=decision;
     }});
   }).catch(()=>{});
  }
  window.addEventListener('pagehide',()=>{
   reviewDisposed=true;pending=null;confirmBox.hidden=true;
   if(reviewMount)reviewMount.dispose();
   lifecycle.dispose();
  },{once:true});
 }catch(_){
  notice.textContent='保存機能を開始できません。ページを再読み込みしてください。';
 }
})();
</script>
</body></html>
